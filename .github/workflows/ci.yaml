name: CI

# Quality gate for every pull request. The publish workflows (build-api,
# build-web) additionally gate image publishing on their own `test` jobs so a
# red build can never ship an image.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  chart:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # backend.openai.apiKeySecret.name has no default (an unset key must fail a
      # real deploy loudly); supply a placeholder so lint can render the chart.
      - run: helm lint ./chart --set backend.openai.apiKeySecret.name=ci-openai

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No lockfile yet — use `npm install`. Switch to `npm ci` once a
      # package-lock.json is committed.
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
