# Classic microservices platform: one public edge, internal APIs behind it.
# Databases/caches belong in the umbrella's Chart.yaml dependencies: block
# (mature upstream charts), not as generated subcharts.
umbrellaChartName: microservices-platform
subcharts:
- name: api-gateway
  pattern: edge-gateway
- name: auth-service
  pattern: api-microservice
  ingress: false
- name: user-service
  pattern: api-microservice
  ingress: false
- name: order-service
  pattern: api-microservice
  ingress: false
