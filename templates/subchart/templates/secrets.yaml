{{- /*
Renders .Values.secrets into an Opaque Secret and (via the shared containers
helper) injects it into the workload with envFrom. Values land in stringData,
so plain strings are fine. No annotations here: the pod checksum annotations
hash this file, so including them would recurse.
*/ -}}
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include (print .Chart.Name ".fullname") . }}
  labels:
    {{- include (print .Chart.Name ".labels") . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
