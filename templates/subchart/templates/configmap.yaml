{{- /*
Renders .Values.config into a ConfigMap and (via the shared containers helper)
injects it into the workload with envFrom. No annotations here: the pod
checksum annotations hash this file, so including them would recurse.
*/ -}}
{{- if .Values.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include (print .Chart.Name ".fullname") . }}
  labels:
    {{- include (print .Chart.Name ".labels") . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
