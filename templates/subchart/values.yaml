# Default values for this subchart. When installed under the umbrella chart,
# any value can be overridden from the umbrella's values.yaml under this
# chart's name.
#
# Finish-the-chart checklist: search for TODO(chartpress).

global:
  # Registry/organization prefix for images, e.g. "ghcr.io/acme". The umbrella
  # chart's global.repository overrides this when installed as a dependency.
  repository: registry.example.com/CHANGEME # TODO(chartpress): set your registry

image:
  registry: "" # optional per-chart override of global.repository
  name: ""     # defaults to the chart name
  tag: ""      # defaults to the chart's appVersion; TODO(chartpress): pin your image tag
  pullPolicy: IfNotPresent

# imagePullSecrets:
#   - name: regcred

# chartpress:section service
service:
  port: 8080 # TODO(chartpress): the port your app listens on
  # targetPort: 8080  # defaults to port
  # portName: http
  # type: ClusterIP
# chartpress:end

# chartpress:section podCount
podCount:
  # "static" pins a replica count; "dynamic" manages replicas with an HPA.
  type: static
  static: 1
  dynamic:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    # targetMemoryUtilizationPercentage: 75
    # metrics: []    # full autoscaling/v2 metrics override
    # behavior: {}
# chartpress:end

resources:
  # TODO(chartpress): size these for your application. A memory limit without a
  # CPU limit is intentional (avoids CPU throttling).
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# chartpress:section probes
# Probe httpGet/tcpSocket ports default to service.port. Remove a probe block
# to disable that probe entirely.
livenessProbe:
  httpGet:
    path: /healthz # TODO(chartpress): your liveness endpoint
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready # TODO(chartpress): your readiness endpoint
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# startupProbe:
#   httpGet:
#     path: /startup
#   periodSeconds: 10
#   failureThreshold: 30
# chartpress:end

# chartpress:section ingress
ingress:
  # Set host to expose this chart; empty means no Ingress is rendered.
  host: "" # TODO(chartpress): e.g. api.example.com
  path: /
  # annotations: {}
  # tls:
  #   - secretName: api-tls
  #     hosts: [api.example.com]
# chartpress:end

# chartpress:section pdb
pdb:
  # Enable once you run 2+ replicas; with a single replica a PDB blocks node drains.
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
# chartpress:end

# chartpress:section networkPolicy
networkPolicy:
  # When enabled, only traffic matching ingressFrom may reach these pods.
  # Remember sibling subcharts and your ingress controller.
  enabled: false
  ingressFrom: []
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: ingress-nginx
# chartpress:end

# One schema for all workload kinds; see templates/_helpers.tpl for details.
volumes: []
#   - name: app-config
#     mountPath: /etc/app/config
#     configMap: app-configmap
#     readOnly: true
#   - name: data                    # statefulset only: becomes a volumeClaimTemplate
#     mountPath: /data
#     pvc:
#       accessModes: ["ReadWriteOnce"]
#       # storageClassName: fast-ssd
#       resources: { requests: { storage: 1Gi } }

# Key/value pairs rendered into a ConfigMap / Secret named after this chart
# and injected into the container via envFrom.
# config:
#   LOG_LEVEL: info
# secrets:
#   API_KEY: changeme

# Adds a busybox sidecar with SYS_PTRACE and enables shareProcessNamespace.
troubleshootingContainer: false

