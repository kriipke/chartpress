apiVersion: chartpress.dev/v1alpha1
kind: ChartpressConfig
metadata:
  name: ml-platform
spec:
  umbrellaChartName: ml-platform
  description: "Model training and serving platform."
  # The model/metadata store is infrastructure — a dependencies: entry, not a
  # generated subchart. The trainer is worker-shaped until chartpress supports
  # Job/CronJob workloads.
  subcharts:
    - name: predictor
      pattern: ml-inference
      description: "Online inference service (slow model load — startupProbe front-loaded)."
    - name: trainer
      pattern: worker
      description: "Training job runner; pulls work, serves nothing."
    - name: task-worker
      pattern: worker
      description: "Async task worker."
    - name: experiments-ui
      pattern: admin-dashboard
      description: "Internal experiments dashboard — protect the route."
  rules:
    ingress: istio
    common_annotations: false
    linked_templates: false
    resource_names_match_chart_name: false
    shared_secrets_config: true
    shared_newrelic_config: true
    generate_umbrella_readme: true
    generate_subchart_readme: true
    include_docs: false
