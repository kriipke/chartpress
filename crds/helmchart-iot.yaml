apiVersion: chartpress.dev/v1alpha1
kind: ChartpressConfig
metadata:
  name: iot-hub
spec:
  umbrellaChartName: iot-hub
  description: "IoT ingestion and device-management platform."
  # The MQTT broker and time-series database are infrastructure: run them from
  # their mature upstream charts via the umbrella's dependencies: block, not as
  # generated subcharts.
  subcharts:
    - name: device-manager
      pattern: api-microservice
      description: "Device registry and lifecycle API."
    - name: data-collector
      pattern: node-agent
      description: "Per-node telemetry collector."
    - name: telemetry-processor
      pattern: stream-processor
      description: "Consumes the telemetry topic; replicas coupled to partitions."
  rules:
    ingress: nginx
    common_annotations: true
    linked_templates: true
    resource_names_match_chart_name: true
    shared_secrets_config: false
    shared_newrelic_config: false
    generate_umbrella_readme: false
    generate_subchart_readme: true
    include_docs: true
