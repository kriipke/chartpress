backend:
  image:
    repository: ghcr.io/kriipke/chartpress/api
    # Pin to a released version, not a floating tag: `latest` makes rollouts
    # non-deterministic and removes any rollback target. Bump on each release.
    tag: 0.1.15
  service:
    type: ClusterIP
    port: 8080
  serviceAccount:
    name: chartpress-backend
  rbac:
    create: true
  openai:
    model: gpt-4.1
    apiKeySecret:
      name: ""   # REQUIRED: Secret name holding the OpenAI API key; empty fails the deploy
      key: api-key
  # GitHub OAuth sign-in (OPTIONAL, identity-only and non-gating). Leave clientID
  # empty to disable sign-in entirely — the app stays fully usable without it.
  # To enable: register a GitHub OAuth App, set its "Authorization callback URL"
  # to https://<ingress.host>/auth/github/callback, and fill in the values below.
  # The chart renders a chartpress-github Secret from them (see github-secret.yaml).
  github:
    clientID: ""
    clientSecret: ""
    # Full callback URL registered on the OAuth App. Defaults to
    # https://<ingress.host>/auth/github/callback when left empty.
    redirectURL: ""
  # Signs the stateless session cookie. REQUIRED when github.clientID is set;
  # use a random 32+ character string.
  sessionSecret: ""

operator:
  serviceAccount:
    name: chartpress-operator
  rbac:
    create: true

s3:
  # Render the chartpress-s3 Secret from accessKey/secretKey below (BYO bucket).
  # Set existingSecret to reference a pre-existing Secret instead (overrides create).
  create: true
  existingSecret: ""
  endpoint: s3.amazonaws.com
  bucket: chartpress-charts
  region: us-east-1
  useSSL: true
  accessKeyKey: access-key
  secretKeyKey: secret-key
  accessKey: ""
  secretKey: ""

frontend:
  image:
    repository: ghcr.io/kriipke/chartpress/web
    # Pin to a released version, not a floating tag (see backend note above).
    tag: 0.1.15
  service:
    type: ClusterIP
    port: 80

ingress:
  class: nginx
  rewriteTarget: /
  host: chartpress.dev
  secretName: cert-wcard
  path: /
  backend:
    service: chartpress-frontend
    port: 80

certificate:
  name: cert-wcard
  secretName: cert-wcard
  issuerName: letsencrypt-wcard
  commonName: chartpress.dev
  dnsNames:
    - "*.chartpress.dev"
    - "chartpress.dev"

issuer:
  name: letsencrypt-wcard
  acme:
    email: kriipke@protonmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: letsencrypt-wcard
    dnsimple:
      groupName: acme.dnsimple.com
      solverName: dnsimple
      accountID: ""
      tokenSecretRef:
        name: dnsimple-dns
        key: token
      # RBAC granting the DNSimple cert-manager webhook ServiceAccount read
      # access to the token secret above, in this release namespace. Rendered by
      # templates/dnsimple-rbac.yaml. Disable if the token is reached another way
      # (e.g. via a ClusterIssuer resolving the secret in cert-manager's namespace).
      webhook:
        createSecretReaderRBAC: true
        serviceAccount:
          name: cert-manager-webhook-dnsimple
          namespace: cert-manager
