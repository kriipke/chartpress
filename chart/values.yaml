backend:
  image:
    repository: ghcr.io/kriipke/chartpress/api
    tag: 0.1.13
  service:
    type: ClusterIP
    port: 8080
  serviceAccount:
    name: chartpress-backend
  rbac:
    create: true
  openai:
    model: gpt-4.1
    apiKeySecret:
      name: ""   # set to a Secret name to inject OPENAI_API_KEY; empty omits the env
      key: api-key

operator:
  serviceAccount:
    name: chartpress-operator
  rbac:
    create: true

s3:
  # Render the chartpress-s3 Secret from accessKey/secretKey below (BYO bucket).
  # Set existingSecret to reference a pre-existing Secret instead (overrides create).
  create: true
  existingSecret: ""
  endpoint: s3.amazonaws.com
  bucket: chartpress-charts
  region: us-east-1
  useSSL: true
  accessKeyKey: access-key
  secretKeyKey: secret-key
  accessKey: ""
  secretKey: ""

frontend:
  image:
    repository: ghcr.io/kriipke/chartpress/web
    tag: 0.1.13
  service:
    type: ClusterIP
    port: 80

ingress:
  class: nginx
  rewriteTarget: /
  host: chartpress.dev
  secretName: cert-wcard
  path: /
  backend:
    service: chartpress-frontend
    port: 80

certificate:
  name: cert-wcard
  secretName: cert-wcard
  issuerName: letsencrypt-wcard
  commonName: chartpress.dev
  dnsNames:
    - "*.chartpress.dev"
    - "chartpress.dev"

issuer:
  name: letsencrypt-wcard
  acme:
    email: kriipke@protonmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: letsencrypt-wcard
    dnsimple:
      groupName: acme.dnsimple.com
      solverName: dnsimple
      accountID: ""
      tokenSecretRef:
        name: dnsimple-dns
        key: token
      # RBAC granting the DNSimple cert-manager webhook ServiceAccount read
      # access to the token secret above, in this release namespace. Rendered by
      # templates/dnsimple-rbac.yaml. Disable if the token is reached another way
      # (e.g. via a ClusterIssuer resolving the secret in cert-manager's namespace).
      webhook:
        createSecretReaderRBAC: true
        serviceAccount:
          name: cert-manager-webhook-dnsimple
          namespace: cert-manager
