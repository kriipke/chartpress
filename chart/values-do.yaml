# DigitalOcean Spaces overrides for the chartpress chart.
#
# Layer this on top of the chart defaults (which target generic AWS S3). The
# bucket + scoped key are provisioned by infra/terraform (env=prod ->
# chartpress-charts-prod); `make wire-do` turns the terraform outputs into the
# chartpress-s3 Secret that s3.existingSecret points at below.
#
#   make wire-do NAMESPACE=chartpress
#   helm upgrade --install chartpress ./chart \
#     -n chartpress -f chart/values-do.yaml \
#     --set backend.openai.apiKeySecret.name=chartpress-openai
#
# Credentials never live in this file — they ride in the chartpress-s3 Secret.
s3:
  create: false                  # don't render an (empty) Secret from the chart
  existingSecret: chartpress-s3  # created by `make wire-do` from terraform outputs
  endpoint: nyc3.digitaloceanspaces.com
  region: nyc3
  bucket: chartpress-charts-prod
  useSSL: true
