{{- $path := .Values.ingress.path | default "/" -}}
{{- $isRoot := eq (trimSuffix "/" $path) "" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chartpress.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.class }}
    {{- if not $isRoot }}
    # Subpath hosting: strip the prefix so the backend still receives "/".
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.class }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.secretName | default .Values.certificate.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if $isRoot }}
          - path: /
            pathType: Prefix
          {{- else }}
          - path: {{ trimSuffix "/" $path }}(/|$)(.*)
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                name: {{ .Values.ingress.backend.service }}
                port:
                  number: {{ .Values.ingress.backend.port }}
