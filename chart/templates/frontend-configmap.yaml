apiVersion: v1
data:
  "default.conf": |+
    server {
        listen       80;
        listen  [::]:80;
        server_name  {{ .Values.ingress.host }};

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }

        # Backend API: async generate, chart listing/detail, and prompt
        # drafting. /download was removed with the sync backend (Phase 2);
        # Phase 3 serves downloads via presigned bucket URLs, not through nginx.
        location ~ ^/(generate|charts|text-to-config)(/|$) {
            proxy_pass http://chartpress-backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

kind: ConfigMap
metadata:
  creationTimestamp: null
  name: nginx-config
