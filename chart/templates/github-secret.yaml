{{- if .Values.backend.github.clientID }}
# Rendered only when GitHub sign-in is enabled (backend.github.clientID set).
# Holds the OAuth App credentials and the session-cookie signing secret; the
# backend Deployment mounts these as GITHUB_OAUTH_* / SESSION_SECRET env vars.
apiVersion: v1
kind: Secret
metadata:
  name: chartpress-github
  labels:
    app: chartpress-backend
type: Opaque
stringData:
  client-id: {{ .Values.backend.github.clientID | quote }}
  client-secret: {{ required "backend.github.clientSecret is required when backend.github.clientID is set" .Values.backend.github.clientSecret | quote }}
  session-secret: {{ required "backend.sessionSecret is required when GitHub sign-in is enabled" .Values.backend.sessionSecret | quote }}
{{- end }}
