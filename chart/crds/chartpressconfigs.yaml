apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chartpressconfigs.chartpress.dev
spec:
  group: chartpress.dev
  names:
    kind: ChartpressConfig
    plural: chartpressconfigs
    singular: chartpressconfig
    shortNames:
      - cpress
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                umbrellaChartName:
                  type: string
                  description: "Name of the umbrella Helm chart (kebab-case)."
                description:
                  type: string
                  description: "Human-readable description for the umbrella chart."
                dependencies:
                  type: array
                  description: "Self-hosted infrastructure (databases, caches, brokers) emitted as umbrella Chart.yaml dependencies from the curated registry — never as generated subcharts. Each item is a registry key (e.g. postgresql, redis, kafka); unknown keys become TODO stubs."
                  items:
                    type: string
                subcharts:
                  type: array
                  description: "List of subcharts and their workload types."
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: "The name of the subchart (kebab-case)."
                      workload:
                        type: string
                        enum: ["deployment", "statefulset", "daemonset"]
                        description: "The workload kind. Omit to take the pattern's default."
                      description:
                        type: string
                        description: "Human-readable description for this subchart."
                      pattern:
                        type: string
                        enum: ["api-microservice", "grpc-service", "edge-gateway", "web-frontend", "worker", "stream-processor", "scheduler", "realtime-gateway", "ml-inference", "webhook-ingest", "admin-dashboard", "node-agent", "custom"]
                        description: "The named workload shape this subchart is generated as. Expands to trait defaults; omitted means api-microservice (back-compat). Explicit trait keys below override."
                      exposure:
                        type: string
                        enum: ["http", "grpc", "tcp", "none"]
                        description: "How the workload is contacted; none means a job executor (no Service, no ingress, no HTTP probes)."
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: "Listening port. Defaults: 8080 (http/tcp), 50051 (grpc); ignored when exposure is none."
                      ingress:
                        type: boolean
                        description: "Route external traffic to this subchart via the platform ingress. Requires exposure http or grpc."
                      scaling:
                        type: string
                        enum: ["auto", "fixed", "singleton"]
                        description: "auto keeps the HPA available, fixed pins a replica count (no HPA), singleton pins exactly one instance (Recreate, no HPA, no PDB). Ignored for daemonsets."
                      shared_env:
                        type: boolean
                        description: "Mount the umbrella's shared ConfigMap/Secrets into this subchart via envFrom (when the shared rules are enabled)."
                rules:
                  type: object
                  properties:
                    ingress:
                      type: string
                      enum: ["alb", "nginx", "traefik", "istio", "gce", "none"]
                      description: "Platform-wide ingress controller (single)."
                    common_annotations:
                      type: boolean
                      description: "Enable or disable common annotations."
                    linked_templates:
                      type: boolean
                      description: "Should subchart templates link shared umbrella partials?"
                    resource_names_match_chart_name:
                      type: boolean
                      description: "Should resource names match the chart name (no release prefix)?"
                    shared_secrets_config:
                      type: boolean
                      description: "Enable a shared umbrella Secret wired into every subchart."
                    shared_newrelic_config:
                      type: boolean
                      description: "Enable shared New Relic config + license wired into every subchart."
                    generate_umbrella_readme:
                      type: boolean
                      description: "Generate a README for the umbrella chart."
                    generate_subchart_readme:
                      type: boolean
                      description: "Generate READMEs for subcharts."
                    include_docs:
                      type: boolean
                      description: "Include the topic docs; the best-practices doc always ships."
                    generate_handoff:
                      type: boolean
                      description: "Generate the sectioned HANDOFF.md at the umbrella root (default true)."
              required: ["umbrellaChartName", "subcharts", "rules"]
            status:
              type: object
              description: "Operator-owned status (written by the chartpress operator)."
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Generating", "Ready", "Failed"]
                  description: "Lifecycle phase of the generated chart."
                observedGeneration:
                  type: integer
                  description: "metadata.generation last reconciled by the operator."
                artifactKey:
                  type: string
                  description: "Object-storage key of the generated chart archive."
                lastGenerated:
                  type: string
                  description: "RFC3339 timestamp of the last successful generation."
                message:
                  type: string
                  description: "Human-readable status detail (error text when Failed)."
      subresources:
        status: {}
